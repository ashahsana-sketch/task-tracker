<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Task tracker</p>
                <h1 id="h1">Task Tracker</h1>
                <p id="h2" class="hero-subtitle">Organize your tasks, prioritize work, and stay focused all day.</p>
            </div>
        </header>
        <main class="task-layout">
            <section class="task-form-card">
                <div class="card-header">
                    <span class="badge">New task</span>
                    <h2>Add a task</h2>
                    <p>Quickly capture the next thing you need to do.</p>
                </div>
                <form id="form-element" class="task-form">
                    <label for="task-input">Task name</label>
                    <input id="task-input" type="text" placeholder="e.g. Review project plan" />

                    <label for="priority-input">Priority</label>
                    <select id="priority-input">
                        <option value="choose-priority" disabled selected>Choose priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <div class="button-row">
                        <button type="submit" id="save-task-button" class="primary-button">Save task</button>
                        <button type="button" id="clear-all" class="secondary-button">Clear all</button>
                    </div>

                    <p id="error-message" class="form-note"></p>
                    <p id="empty-message" class="form-note"></p>
                </form>
            </section>
            <section class="task-list-card">
                <div class="card-header">
                    <h2>Your tasks</h2>
                    <p>Click status to mark tasks complete.</p>
                </div>
                <div id="tasks-print" class="tasks-print"></div>
                <div id="app" class="tasks-print"></div>
            </section>
            <aside class="stats-sidebar">
                <div class="sidebar-header">
                    <h2>Statistics</h2>
                    <p>Live summary of your task progress.</p>
                </div>
                <div id="stats" class="sidebar-card"></div>
                <div id="inComplete" class="sidebar-card sidebar-section"></div>
                <div id="HighPriority" class="sidebar-card sidebar-section"></div>
            </aside>
        </main>
    </div>
    <script type="module" src="dist/dag10.js" defer></script>
</body>
</html>
